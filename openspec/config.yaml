# ==============================================
# OpenSpec 项目配置（规范驱动开发）
# ==============================================
schema: spec-driven

# ---------- 基础上下文 ----------
context: |
  语言：中文（简体）
  所有产出物必须用简体中文撰写（专业术语如 API、REST、GraphQL、DTO、ORM 等可使用英文）。

# ---------- 规则定义 ----------
rules:
  # ----- 1. 变更提案 (Proposal) 规则 -----
  proposal:
    rollback_plan: "必须提供明确的数据回滚脚本（如 migration down）或代码回滚步骤（如 feature toggle 关闭方案）。"
    impact_scope: "明确标识受影响的上下游团队、外部依赖方，以及需要通知的相关方清单。"
    database_change:
      requirements:
        - "列出所有新增/修改的 Entity 字段（含类型、长度、默认值、是否可空）。"
        - "提供迁移策略（如：零停机迁移 -> 先加后删；或维护窗口期停机）。"
        - "存量数据的清洗/回填脚本必须包含在提案中。"
    third_party_dependency:
      requirements:
        - "选型理由（为什么选这个而不是其他）。"
    api_compatibility: |
      必须标注是否为 Breaking Change。
      - 若是，必须提供版本过渡方案（如 /v1/ 与 /v2/ 共存策略）。
      - 若否，必须遵循"向前兼容"原则（新增字段可选，不删除旧字段）。
    performance_impact: "新增查询必须提供执行计划分析，并在设计文档中明确新增的数据库索引（DDL 语句）。"
    observability: "明确新增业务关键节点的日志级别（Info/Warn/Error）及 Trace 埋点要求。"

  # ----- 2. 规格说明 (Specs) 规则 -----
  specs:
    format: "必须严格遵循 Given（前置条件）、When（触发动作）、Then（预期结果）结构化格式。"
    principle: "优先查阅并复用项目现有的 Spec 模式（如已有的测试基类或通用 Step 定义），禁止重复造轮子。"
    coverage_scenarios:
      - "正向主流程"
      - "异常回滚流程"
      - "并发边界条件"

  # ----- 3. 技术设计 (Design) 规则 -----
  design:
    architecture: |
      架构设计必须详细到模块级别，并用表格列出：
      | 模块名 | 核心职责 | 依赖模块（内部） | 外部依赖（中间件/SDK） | 通信方式（REST/gRPC/Event） |
    database: |
      数据库模型设计必须详细到每个字段，包括字段名、类型、索引、默认值等，用表格形式列出。

  # ----- 4. 任务拆解 (Tasks) 规则 -----
  tasks:
    build_order:
      - "基础设施与配置（环境变量、配置文件、 Migration 脚本）"
      - "数据持久层（Entity/Model 定义、Repository/DAO 接口）"
      - "业务逻辑层（Service/Manager 实现、DTO 转换）"
      - "接入层（Controller/Handler、参数校验器）"
      - "切面与中间件（拦截器、过滤器、AOP 日志）"
      - "文档与元数据（OpenAPI/Swagger 更新、README 更新）"
    granularity: "每个任务的工作量预估应控制在 10 分钟以内，便于 Code Review 高效进行。"
    testing:
      requirements:
        - "单元测试（覆盖核心算法与分支逻辑）。"
        - "集成测试（覆盖数据库交互与外部 API 调用，可依赖 Testcontainers 或 Mock）。"
    dependency: |
      若任务之间存在依赖关系，必须使用 `depends_on: [任务ID]` 明确标注。
      若多模块并行开发，需明确模块间的契约（接口定义或 Proto 文件）作为前置依赖。

# ---------- 操作执行指引 ----------
operations:
  apply:
    guidance:
      coding_standard: "若有项目或全局规定的编码规范，则严格按规范编码，否则与项目历史代码保持一致。"
      logging: "业务开始、结束、关键入参、核心判断结果、状态变更前后值、异常上下文等需有日志记录。"
      unit_testing: "单元测试必须严格按照 specs 中列出的 Given/When/Then 场景逐条编写，不得遗漏，核心模块覆盖率需达到 80% 以上。"
      docs_update: "所有任务完成后，必须更新或创建项目根目录下的 README.md。"
