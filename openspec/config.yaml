# ==============================================================================
# OpenSpec 项目配置 —— bics-commons
# 已使用 @fission-ai/openspec 1.12.0 核对，日期：2026-09-08
# rules 是生成 Artifact 时使用的 Agent 提示约束，不是机器级门禁。
# ==============================================================================

schema: spec-driven

context: |
  - 未经明确批准，变更必须保持既有公共 API、公共类型、默认行为、错误与降级语义，以及跨版本 Redis、日志和 YAML 配置协议兼容。
  - 公共库不得新增 spec 或既有契约未要求的副作用输出；不得记录原始参数、返回值、Redis key/value、凭据等敏感数据，且 Logger 获取或写入失败不得改变原业务结果。
  - 所有 artifacts 产出物使用简体中文；通用技术术语可以保留英文，schema 模板规定的英文结构关键字必须原样保留。

rules:
  proposal:
    - |
      始终：在 Impact 中明确写出“公共契约变更：是或否”、兼容性结论及判定理由。判定范围包括公共导出与类型、默认行为、错误语义、装饰器行为、peerDependency、Redis 协议、日志格式和 YAML 配置结构。
    - |
      当变更需要随包发布时：逐个读取受影响包的当前版本并判断 changeset 级别。主版本为 0 时，兼容修复使用 patch，新增兼容能力或破坏性变更使用 minor；主版本不为 0 时，兼容修复使用 patch，新增兼容能力使用 minor，破坏性变更使用 major。
    - "当兼容性结论为不兼容时：说明破例理由、迁移必要性和已知受影响下游，并标记是否需要下游确认或通知；无法确认下游清单时标记“待维护者确认”，不得编造。"
    - |
      当新增或改变第三方依赖时：在 Impact 中说明用途，以及对下游安装和运行环境的影响。
      当依赖仅用于普通测试且没有实质影响时：说明用途和“无下游影响”即可。
    - "当变更触及跨进程或跨版本数据契约时：在 Impact 中列出受影响的 Redis key/value、锁协议、日志格式或 HTTP 传输契约，并标记是否需要新旧版本共存或存量数据处理；不在 proposal 中展开技术方案。"

  specs:
    - "当新增或修改外部可观测行为时：按适用范围补充与本次变化相关的主流程、错误、缺省、边界和关键参数组合；不得机械加入无关场景。"
    - "当公共 TypeScript 类型的可用范围、推导结果或诊断结果发生变化时：用 Scenario 描述调用方可观察的合法与非法用法。"
    - "当装饰器的公共行为发生变化时：定义调用方可观察的求值、执行和组合顺序；元数据仅在属于外部兼容契约时描述。"
    - "当跨进程或跨版本数据契约发生变化时：定义兼容、拒绝、降级或失败等可观察结果。"
    - "当缓存、分布式锁、HTTP 或日志能力发生变化时：只覆盖本次变化实际影响的边界和外部依赖失败语义；key、序列化、header 或日志字段仅在属于公共或跨版本契约时描述。"
    - "当编写 Scenario 时：标题在同一 Requirement 内唯一并表达具体行为；语义未变时保持既有标题。"

  design:
    - "当变更涉及公共 TypeScript 契约时：在 Decisions 中给出拟采用的导出签名、选项字段结构、必填性和泛型约束，并说明如何实现 specs 中定义的类型行为；不重复描述行为要求。"
    - "当变更涉及装饰器时：在 Decisions 中说明 reflect-metadata 键和元数据结构、experimentalDecorators / emitDecoratorMetadata 前提，以及实现 specs 中求值和执行顺序的机制；按 TypeScript legacy decorators 语义设计，不使用 stage-3 语义。"
    - |
      当新增或改变第三方依赖时：在 Decisions 中说明 dependency/peerDependency/devDependency 归类、版本兼容范围，以及该归类如何影响下游安装责任。
      当依赖仅用于普通测试且没有实质影响时：只记录 devDependency 归类和兼容范围。
    - "当变更涉及破坏性公共契约、跨版本 Redis/日志/HTTP 协议，或存在发布顺序要求时：在 Migration Plan 中说明新旧版本共存方案、存量数据或消费者处理方式，以及修订版本或下游锁版路径；不得假设已发布 npm 版本可以撤回。"
    - |
      当变更涉及两个及以上包时：用表格列出以下信息：
      | 包 | 本次职责变化 | 依赖的其他包 | 外部依赖 | 是否需要同步发版 |

  tasks:
    - 尽量为每个 Scenario 安排对应的测试或验证任务，并在任务中直接写明场景行为和验证方式。
    - 多个 Scenario 可以共享同一任务或测试。
    - 公共 TypeScript 类型应包含编译正例和明确负例，无法自动化的场景则写明人工验证步骤。
